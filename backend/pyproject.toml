[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Aegis AI - Agentic AI Governance and Identity control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # windows: uvloop/httptools have no wheels there, so keep the pure-python stack
    "uvicorn[standard]>=0.30; sys_platform != 'win32'",
    "uvicorn>=0.30; sys_platform == 'win32'",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "python-ulid>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aegis*"]
